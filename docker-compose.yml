version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scraper_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: scraper_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
